apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: my-python-web-api-app-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "9ea781ef-bc92-422f-9123-c6ca532c4ae0"
    keyvaultName: "davidpy-kv-2026"
    tenantId: "f5ddb481-7e3f-460a-8c91-c47fca3e1300"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
  # Also copy the Key Vault secret into a Kubernetes Secret, so it can be used as an env var
  secretObjects:
    - secretName: my-python-web-api-app-secrets
      type: Opaque
      data:
        - objectName: db-password
          key: DB_PASSWORD
